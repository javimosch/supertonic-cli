[project]
name = "supertonic-cli"
version = "0.1.0"
description = "On-device TTS from the command line — super fast, 31 languages, no cloud"
requires-python = ">=3.9"
dependencies = [
    "supertonic>=1.0.0",
]

[project.scripts]
supertonic-cli = "supertonic_cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
